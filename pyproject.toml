[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchtrial"
version = "0.1.0"
description = "A model-agnostic coding harness that puts AI-generated patches on trial"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PatchTrial Team"}]
dependencies = []

[project.scripts]
patchtrial = "patchtrial.cli:main"

[tool.setuptools.packages.find]
include = ["patchtrial*"]

